name: CampusPilot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Security, RLS & Integration Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campuspilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          cd backend
          npx playwright install --with-deps chromium

      - name: Initialize Non-Owner Role & Run Migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: campuspilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        run: |
          # Create non-owner app role for strict RLS enforcement
          PGPASSWORD=test_password psql -h localhost -U postgres -d campuspilot -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'campuspilot_app') THEN
                CREATE ROLE campuspilot_app WITH LOGIN PASSWORD 'test_password';
              END IF;
            END
            \$\$;
          "
          # Run database schema, seed, RLS policies, and non-owner permissions
          cd backend
          npm run migrate

      - name: Run Vitest Security, State Machine & Multi-Tenancy Suite
        env:
          NODE_ENV: test
          REQUIRE_REAL_DB: 'true'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: campuspilot
          POSTGRES_USER: campuspilot_app
          POSTGRES_PASSWORD: test_password
          JWT_SECRET: campuspilot_test_jwt_secret_min_32_characters_long!
          VOICE_WEBHOOK_SECRET: test_voice_webhook_secret_key_32chars
        run: |
          cd backend
          npm test

      - name: Run Playwright CSP Header Smoke Test
        env:
          NODE_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: campuspilot
          POSTGRES_USER: campuspilot_app
          POSTGRES_PASSWORD: test_password
          JWT_SECRET: campuspilot_test_jwt_secret_min_32_characters_long!
          VOICE_WEBHOOK_SECRET: test_voice_webhook_secret_key_32chars
        run: |
          cd backend
          node test/smoke_csp.js
