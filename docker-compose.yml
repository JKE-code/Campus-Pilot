version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campuspilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: campuspilot
    ports:
      - "5432:5432"
    volumes:
      - campuspilot_pgdata:/var/lib/postgresql/data
      - ./database/00_init_roles.sql:/docker-entrypoint-initdb.d/00_init_roles.sql:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campuspilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campuspilot_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuspilot_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=campuspilot_app
      - POSTGRES_PASSWORD=campuspilot_app_secure_pass_2026
      - POSTGRES_DB=campuspilot
      - REQUIRE_REAL_DB=true
      - DEMO_MODE=false
      - JWT_SECRET=campuspilot_prod_jwt_secret_key_32chars_min!
      - VOICE_HMAC_SECRET=campuspilot_prod_voice_hmac_secret_32char!
      - OUTPASS_HMAC_SECRET=campuspilot_prod_voice_hmac_secret_32char!
      - CORS_ALLOWLIST=http://localhost,http://localhost:8080,http://frontend
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campuspilot_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campuspilot_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - campuspilot_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: campuspilot_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
    volumes:
      - campuspilot_n8n_data:/home/node/.n8n
      - ./workflows:/workflows
    networks:
      - campuspilot_net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  campuspilot_pgdata:
  campuspilot_n8n_data:

networks:
  campuspilot_net:
    driver: bridge
